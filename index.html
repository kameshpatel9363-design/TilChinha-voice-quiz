<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Til-Chinha Voice Record Self Test</title>
  <style>
    :root { font-family: Arial, sans-serif; color:#1f2937; background:#f7f8fb; }
    body { margin:0; padding:20px; }
    .card { max-width:760px; margin:auto; background:#fff; border-radius:16px; padding:24px; box-shadow:0 8px 30px rgba(0,0,0,.08); }
    h1 { margin-top:0; }
    .muted { color:#6b7280; }
    label { display:block; font-weight:700; margin:16px 0 6px; }
    input, select { width:100%; box-sizing:border-box; border:1px solid #d1d5db; border-radius:10px; padding:11px; font-size:16px; }
    .prompt { background:#f3f4f6; border-radius:12px; padding:16px; font-size:18px; line-height:1.55; }
    .buttons { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
    button { border:0; border-radius:10px; padding:12px 16px; font-size:16px; cursor:pointer; min-height:48px; }
    .primary { background:#2563eb; color:#fff; }
    .stop { background:#dc2626; color:#fff; }
    .secondary { background:#e5e7eb; color:#111827; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    audio { width:100%; margin-top:14px; }
    #status { margin-top:12px; font-weight:700; }
    .success { color:#15803d; }
    .error { color:#b91c1c; }
    #referenceBox { display:none; margin-top:22px; }
    .reference { background:#fff7ed; border-left:4px solid #f59e0b; padding:14px; border-radius:8px; white-space:pre-wrap; line-height:1.55; }
    .scoreRow { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media(max-width:600px) {
      body { padding:10px; }
      .card { padding:18px; }
      .scoreRow { grid-template-columns:1fr; }
      h1 { font-size:28px; }
      button { width:100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Til-Chinha Voice Record Self Test</h1>
    <p class="muted">Record your answer, listen to it, compare it with the reference answer, then score yourself.</p>

    <label for="name">Your name</label>
    <input id="name" placeholder="Enter your name" autocomplete="name">

    <label for="questionSelect">Question</label>
    <select id="questionSelect"></select>

    <label>Question / Prompt</label>
    <div id="prompt" class="prompt">Loading questions…</div>

    <div class="buttons">
      <button id="startBtn" class="primary" onclick="startRecording()">🎙 Start Recording</button>
      <button id="stopBtn" class="stop" onclick="stopRecording()" disabled>⏹ Stop</button>
    </div>

    <div id="status" class="muted"></div>
    <audio id="player" controls style="display:none"></audio>

    <div id="referenceBox">
      <label>Reference answer</label>
      <div id="reference" class="reference"></div>

      <div class="scoreRow">
        <div>
          <label for="score">Your self-score</label>
          <select id="score">
            <option value="">Choose…</option>
            <option value="5/5">5/5 — Fully correct</option>
            <option value="4/5">4/5 — Mostly correct</option>
            <option value="3/5">3/5 — Partly correct</option>
            <option value="2/5">2/5 — Some correct ideas</option>
            <option value="1/5">1/5 — Needs improvement</option>
          </select>
        </div>
        <div>
          <label for="notes">Notes (optional)</label>
          <input id="notes" placeholder="What did you miss?">
        </div>
      </div>

      <div class="buttons">
        <button id="submitBtn" class="primary" onclick="submitResponse()">Submit Response</button>
        <button class="secondary" onclick="resetForQuestion()">Record Again</button>
      </div>
    </div>
  </div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwsG-sGDUR8PfkctsFbD374GOK-06gqg7ToK_VrzmXdbHSowCAJ7rQKv33G7fYbgE983g/exec";

let questions = [];
let mediaRecorder = null;
let audioChunks = [];
let audioBlob = null;
let activeStream = null;

function loadQuestionsFromApi() {
  const s = document.createElement('script');
  s.src = API_URL + '?action=questions&callback=receiveQuestions&_=' + Date.now();
  s.onerror = () => showError('Could not load questions from Google Sheets.');
  document.body.appendChild(s);
}

function receiveQuestions(payload) {
  if (!payload || !payload.success) {
    return showError(payload && payload.error ? payload.error : 'Could not load questions.');
  }
  questions = payload.questions || [];
  const sel = document.getElementById('questionSelect');
  sel.innerHTML = '';

  if (!questions.length) {
    document.getElementById('prompt').textContent = 'No active questions found.';
    return;
  }

  questions.forEach(q => {
    const opt = document.createElement('option');
    opt.value = q.id;
    opt.textContent = q.id + ' — ' + q.prompt.substring(0,55);
    sel.appendChild(opt);
  });

  sel.onchange = showSelectedQuestion;
  showSelectedQuestion();
}

function currentQuestion() {
  const id = document.getElementById('questionSelect').value;
  return questions.find(q => q.id === id) || questions[0];
}

function showSelectedQuestion() {
  const q = currentQuestion();
  document.getElementById('prompt').textContent = q ? q.prompt : 'No active questions found.';
  resetForQuestion();
}

async function startRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return setStatus('This browser does not support microphone recording.', true);
  }

  try {
    activeStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    audioChunks = [];
    audioBlob = null;

    let options = {};
    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
      options.mimeType = 'audio/webm;codecs=opus';
    } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
      options.mimeType = 'audio/mp4';
    }

    mediaRecorder = new MediaRecorder(activeStream, options);
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const mime = mediaRecorder.mimeType || options.mimeType || 'audio/webm';
      audioBlob = new Blob(audioChunks, { type:mime });
      const player = document.getElementById('player');
      player.src = URL.createObjectURL(audioBlob);
      player.style.display = 'block';
      if (activeStream) {
        activeStream.getTracks().forEach(t => t.stop());
        activeStream = null;
      }
      document.getElementById('referenceBox').style.display = 'block';
      const q = currentQuestion();
      document.getElementById('reference').textContent = q ? q.reference : '';
      setStatus('Recording stopped. Listen to your answer and compare it with the reference.');
    };

    mediaRecorder.start();
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    document.getElementById('referenceBox').style.display = 'none';
    document.getElementById('player').style.display = 'none';
    setStatus('Recording…');
  } catch (err) {
    setStatus('Microphone access was not granted. Please allow microphone access and try again.', true);
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
}

function resetForQuestion() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    try { mediaRecorder.stop(); } catch(e) {}
  }
  if (activeStream) {
    activeStream.getTracks().forEach(t => t.stop());
    activeStream = null;
  }
  audioChunks = [];
  audioBlob = null;
  const player = document.getElementById('player');
  player.style.display = 'none';
  player.removeAttribute('src');
  document.getElementById('referenceBox').style.display = 'none';
  document.getElementById('score').value = '';
  document.getElementById('notes').value = '';
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
  setStatus('');
}

async function submitResponse() {
  const name = document.getElementById('name').value.trim();
  const q = currentQuestion();
  const score = document.getElementById('score').value;
  const notes = document.getElementById('notes').value.trim();

  if (!name) return setStatus('Please enter your name.', true);
  if (!q) return setStatus('No question selected.', true);
  if (!audioBlob) return setStatus('Please make a recording first.', true);
  if (!score) return setStatus('Please choose your self-score.', true);

  document.getElementById('submitBtn').disabled = true;
  setStatus('Uploading recording and saving response…');

  try {
    const base64 = await blobToBase64(audioBlob);
    const body = new URLSearchParams();
    body.set('name', name);
    body.set('questionId', q.id);
    body.set('score', score);
    body.set('notes', notes);
    body.set('audioBase64', base64);
    body.set('mimeType', audioBlob.type || 'audio/webm');

    await fetch(API_URL, { method:'POST', mode:'no-cors', body });
    setStatus('Response submitted successfully.', false, true);
  } catch (err) {
    setStatus('Could not submit response. Please try again.', true);
  } finally {
    document.getElementById('submitBtn').disabled = false;
  }
}

function blobToBase64(blob) {
  return new Promise((resolve,reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function setStatus(message, isError=false, isSuccess=false) {
  const el = document.getElementById('status');
  el.textContent = message || '';
  el.className = isError ? 'error' : (isSuccess ? 'success' : 'muted');
}

function showError(err) {
  setStatus(err && err.message ? err.message : String(err || 'Something went wrong.'), true);
}

loadQuestionsFromApi();
</script>
</body>
</html>
